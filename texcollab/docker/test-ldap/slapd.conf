include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema

modulepath /usr/lib/ldap
moduleload back_mdb

pidfile /tmp/slapd.pid
# Filled in by start.sh when /certs contains a key pair.
include /tmp/tls.conf

database mdb
suffix "dc=example,dc=org"
rootdn "cn=admin,dc=example,dc=org"
rootpw admin-secret
directory /var/lib/ldap-test

# The service account may read everything; users may bind; nobody else reads.
access to attrs=userPassword
  by anonymous auth
  by * none
access to *
  by dn.exact="cn=reader,dc=example,dc=org" read
  by self read
  by * none

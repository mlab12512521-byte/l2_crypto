# Prometheus for TeXCollab (compose.monitoring.yml). Scrapes the app's
# metrics port over the internal network; nothing here is exposed publicly.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: texcollab
    static_configs:
      - targets: ["app:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# To send alerts, run an Alertmanager and uncomment:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

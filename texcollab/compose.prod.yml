# Production overlay: TLS reverse proxy in front of the app.
#   docker compose -f compose.yml -f compose.prod.yml up -d
# (or set COMPOSE_FILE=compose.yml:compose.prod.yml in .env)
# See docs/operations.md.

services:
  app:
    # Only reachable through the proxy.
    ports: !reset []
    environment:
      TRUST_PROXY_HOPS: "1"
    networks:
      - proxy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TEXCOLLAB_DOMAIN: ${TEXCOLLAB_DOMAIN:?set TEXCOLLAB_DOMAIN in .env}
      TEXCOLLAB_TLS: ${TEXCOLLAB_TLS:-}
      TEXCOLLAB_MAX_BODY: ${TEXCOLLAB_MAX_BODY:-1100MB}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${HTTPS_BIND:-0.0.0.0}:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:

networks:
  # Proxy <-> app; the proxy also needs outbound access for Let's Encrypt.
  proxy:
